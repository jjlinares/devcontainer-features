name: Test Features

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  generated-and-duplicate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base-image:
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/base:debian
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0
      - name: Test defaults and duplicate installation
        run: >-
          devcontainer features test --skip-scenarios
          --features browser-tools
          --base-image "${{ matrix.base-image }}"
          --remote-user vscode .

  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0
      - name: Test browser tools scenarios
        run: >-
          devcontainer features test --features browser-tools
          --skip-autogenerated --skip-duplicated .

  pi-generated-and-duplicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0
      - name: Prepare host Pi fixture
        run: ./scripts/prepare-pi-feature-test-host.sh
      - name: Test Pi defaults and duplicate installation
        run: >-
          devcontainer features test --skip-scenarios
          --features pi-coding-agent
          --base-image mcr.microsoft.com/devcontainers/base:ubuntu
          --remote-user vscode .

  pi-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0
      - name: Prepare host Pi fixture
        run: ./scripts/prepare-pi-feature-test-host.sh
      - name: Test Pi scenarios
        run: >-
          devcontainer features test --features pi-coding-agent
          --skip-autogenerated --skip-duplicated .
