name: Release Features

on:
  workflow_dispatch:

jobs:
  generated-and-duplicate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base-image:
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/base:debian
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0
      - name: Test defaults and duplicate installation
        run: >-
          devcontainer features test --skip-scenarios
          --features browser-automation
          --base-image "${{ matrix.base-image }}"
          --remote-user vscode .

  scenarios:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0
      - name: Test option scenarios
        run: >-
          devcontainer features test --features browser-automation
          --skip-autogenerated --skip-duplicated .

  deploy:
    if: github.ref == 'refs/heads/main'
    needs:
      - generated-and-duplicate
      - scenarios
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify generated Feature documentation
        run: |
          ./scripts/generate-feature-docs.sh
          git diff --exit-code -- src/browser-automation/README.md

      - name: Publish Features
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "false"
          devcontainer-cli-version: "0.88.0"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
