name: Release Features

on:
  workflow_dispatch:

jobs:
  generated-and-duplicate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base-image:
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/base:debian
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0
      - name: Test defaults and duplicate installation
        run: >-
          devcontainer features test --skip-scenarios
          --features browser-tools
          --base-image "${{ matrix.base-image }}"
          --remote-user vscode .

  scenarios:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0
      - name: Test browser tools scenarios
        run: >-
          devcontainer features test --features browser-tools
          --skip-autogenerated --skip-duplicated .

  pi-generated-and-duplicate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0
      - name: Prepare host Pi fixture
        run: ./scripts/prepare-pi-feature-test-host.sh
      - name: Test Pi defaults and duplicate installation
        run: >-
          devcontainer features test --skip-scenarios
          --features pi-coding-agent
          --base-image mcr.microsoft.com/devcontainers/base:ubuntu
          --remote-user vscode .

  pi-scenarios:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0
      - name: Prepare host Pi fixture
        run: ./scripts/prepare-pi-feature-test-host.sh
      - name: Test Pi scenarios
        run: >-
          devcontainer features test --features pi-coding-agent
          --skip-autogenerated --skip-duplicated .

  t3code:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Dev Container CLI
        run: npm install --global @devcontainers/cli@0.88.0
      - name: Test T3 defaults and duplicate installation
        run: >-
          devcontainer features test --skip-scenarios --features t3code
          --base-image mcr.microsoft.com/devcontainers/base:ubuntu
          --remote-user vscode .
      - name: Test T3 scenarios
        run: >-
          devcontainer features test --features t3code
          --skip-autogenerated --skip-duplicated .

  deploy:
    if: github.ref == 'refs/heads/main'
    needs:
      - generated-and-duplicate
      - scenarios
      - pi-generated-and-duplicate
      - pi-scenarios
      - t3code
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify generated Feature documentation
        run: |
          ./scripts/generate-feature-docs.sh
          git diff --exit-code -- src/*/README.md

      - name: Publish Features
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "false"
          devcontainer-cli-version: "0.88.0"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
